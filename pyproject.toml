[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenDriveVLA"
version = "1.0.0.dev1"
description = "DINOv3 camera world-model and NAVSIM diffusion GRPO training"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.29",
    "numpy>=1.24,<2",
    "pillow",
    "huggingface_hub",
    "safetensors",
    "scipy",
    "tqdm",
    "tensorboard",
]

[project.optional-dependencies]
train = ["wandb"]
zero3 = ["deepspeed"]

[tool.setuptools.packages.find]
include = ["drivevla*", "llava*"]
namespaces = true

[tool.black]
line-length = 100
target-version = ["py310"]
